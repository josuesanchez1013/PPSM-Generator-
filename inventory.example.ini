# Example inventory for ppsm.yml. Copy to inventory.ini (ignored by git) and
# edit. Groups that are absent are skipped with a warning, so delete any
# section that does not apply.

[linux]
web01 ansible_host=10.20.30.20
db01  ansible_host=10.20.30.15

[windows]
dc01  ansible_host=10.20.30.30

[windows:vars]
ansible_connection=winrm
ansible_winrm_transport=kerberos
# ansible_winrm_server_cert_validation=ignore   # self-signed WinRM listeners only

[cisco]
fw01  ansible_host=10.20.1.1

[cisco:vars]
ansible_network_os=cisco.asa.asa
ansible_connection=network_cli

[switches]
core01 ansible_host=10.20.1.2

[switches:vars]
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli
# flow_monitor=FLOW-IN-IQCORE
